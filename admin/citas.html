<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Citas · Origen Brows & Hair Studio</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  body { background: var(--color-cream-soft); }
  .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 100px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .admin-header h1 { font-size: 1.8rem; margin: 0; }
  #login-gate { max-width: 420px; margin: 100px auto; text-align: center; }
  #login-gate .btn { margin-top: 16px; }
  .admin-filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .admin-filters select, .admin-filters input {
    padding: 10px 14px; border-radius: 10px; border: 1.5px solid rgba(33,29,25,0.15);
    font-family: var(--font-body); background: var(--color-white);
  }
  table.bookings-table { width: 100%; border-collapse: collapse; background: var(--color-white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .bookings-table th, .bookings-table td { padding: 14px 16px; text-align: left; font-size: 0.88rem; border-bottom: 1px solid rgba(33,29,25,0.08); vertical-align: top; }
  .bookings-table th { background: var(--color-cream); font-weight: 600; color: var(--color-dark); }
  .status-pill { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
  .status-pending { background: #f4e3c1; color: #7a5b12; }
  .status-confirmed { background: #d3ead8; color: #1f6b34; }
  .status-cancelled, .status-expired { background: #eee; color: #777; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .row-actions .btn { padding: 6px 14px; font-size: 0.78rem; }
  #empty-state, #loading-state { text-align: center; padding: 60px 20px; color: var(--color-muted); }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>

<div id="login-gate">
  <p class="section-eyebrow">Origen Brows &amp; Hair Studio</p>
  <h1 class="section-title">Panel de citas</h1>
  <p class="section-note">Inicia sesión para ver y confirmar las citas.</p>
  <button class="btn btn-primary" id="login-btn">Iniciar sesión</button>
</div>

<div class="admin-wrap" id="admin-wrap" hidden>
  <div class="admin-header">
    <h1>Citas</h1>
    <div class="row-actions">
      <a class="btn btn-outline btn-sm" href="lealtad.html">Reporte de lealtad</a>
      <button class="btn btn-outline btn-sm" id="refresh-btn">Actualizar</button>
      <button class="btn btn-outline btn-sm" id="logout-btn">Cerrar sesión</button>
    </div>
  </div>

  <div class="admin-filters">
    <select id="filter-status">
      <option value="">Todos los estados</option>
      <option value="pending">Pendientes</option>
      <option value="confirmed">Confirmadas</option>
      <option value="cancelled">Canceladas</option>
      <option value="expired">Vencidas</option>
    </select>
    <input type="date" id="filter-date" />
  </div>

  <div id="loading-state">Cargando citas…</div>
  <div id="empty-state" hidden>No hay citas con esos filtros.</div>

  <div class="table-scroll">
    <table class="bookings-table" id="bookings-table" hidden>
      <thead>
        <tr>
          <th>Código</th>
          <th>Cliente</th>
          <th>Servicio</th>
          <th>Fecha / horario</th>
          <th>Anticipo</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="bookings-tbody"></tbody>
    </table>
  </div>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
(function () {
  "use strict";

  const STATUS_LABEL = { pending: "Pendiente", confirmed: "Confirmada", cancelled: "Cancelada", expired: "Vencida" };

  const loginGate = document.getElementById("login-gate");
  const adminWrap = document.getElementById("admin-wrap");
  const loadingState = document.getElementById("loading-state");
  const emptyState = document.getElementById("empty-state");
  const table = document.getElementById("bookings-table");
  const tbody = document.getElementById("bookings-tbody");
  const filterStatus = document.getElementById("filter-status");
  const filterDate = document.getElementById("filter-date");

  function formatDateTime(dateStr, start, end) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const dateLabel = date.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
    return `${dateLabel} · ${start.slice(0, 5)} – ${end.slice(0, 5)}`;
  }

  async function authHeaders() {
    const user = window.netlifyIdentity.currentUser();
    if (!user) return {};
    const token = await user.jwt();
    return { Authorization: `Bearer ${token}` };
  }

  async function loadBookings() {
    loadingState.hidden = false;
    table.hidden = true;
    emptyState.hidden = true;

    const params = new URLSearchParams();
    if (filterStatus.value) params.set("status", filterStatus.value);
    if (filterDate.value) params.set("date", filterDate.value);

    const headers = await authHeaders();
    const res = await fetch(`/api/list-bookings?${params.toString()}`, { headers });
    const body = await res.json();
    loadingState.hidden = true;

    if (!res.ok) {
      emptyState.textContent = "No se pudieron cargar las citas.";
      emptyState.hidden = false;
      return;
    }

    const bookings = body.bookings || [];
    if (bookings.length === 0) {
      emptyState.textContent = "No hay citas con esos filtros.";
      emptyState.hidden = false;
      return;
    }

    tbody.innerHTML = bookings
      .map(
        (b) => `
        <tr data-id="${b.id}">
          <td>${b.reservation_code}${b.reward_redemption ? '<br/><span class="status-pill" style="background:#f0dcc0;color:#7a4a12;margin-top:4px;">🎁 Canje de lealtad</span>' : ""}${b.payment_method === "mercado_pago" ? '<br/><span class="status-pill" style="background:#d6e4f0;color:#1a4a73;margin-top:4px;">💳 Pagado con tarjeta</span>' : ""}${b.revenue_exempt ? `<br/><span class="status-pill" style="background:#e6e2da;color:#5c5344;margin-top:4px;">🎟️ Sin ingreso${b.revenue_exempt_reason ? " — " + b.revenue_exempt_reason : ""}</span>` : ""}</td>
          <td>${b.customer_name}<br/><span style="color:var(--color-muted)">${b.customer_phone}</span></td>
          <td>${b.service_name}</td>
          <td>${formatDateTime(b.booking_date, b.start_time, b.end_time)}</td>
          <td>$${b.deposit_amount} MXN</td>
          <td><span class="status-pill status-${b.status}">${STATUS_LABEL[b.status] || b.status}</span></td>
          <td>
            <div class="row-actions">
              ${
                b.status === "pending"
                  ? `<button class="btn btn-primary btn-sm" data-action="confirm">Confirmar depósito</button>
                     <button class="btn btn-outline btn-sm" data-action="cancel">Cancelar</button>`
                  : b.status === "confirmed"
                    ? `<button class="btn btn-outline btn-sm" data-action="cancel">Cancelar</button>`
                    : b.status === "expired"
                      ? `<button class="btn btn-primary btn-sm" data-action="reactivate">Reactivar (ya llegó el depósito)</button>`
                      : ""
              }
              <button class="btn btn-outline btn-sm" data-action="toggle-revenue" data-revenue-exempt="${b.revenue_exempt}">${b.revenue_exempt ? "Quitar marca de sin ingreso" : "Marcar sin ingreso"}</button>
            </div>
          </td>
        </tr>`
      )
      .join("");

    table.hidden = false;
  }

  const ACTION_ENDPOINT = {
    confirm: "/api/confirm-booking",
    cancel: "/api/cancel-booking",
    reactivate: "/api/reactivate-booking",
    "toggle-revenue": "/api/mark-no-revenue",
  };

  tbody.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const row = btn.closest("tr");
    const id = row.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    const endpoint = ACTION_ENDPOINT[action];

    let extraPayload = {};
    if (action === "toggle-revenue") {
      const currentlyExempt = btn.getAttribute("data-revenue-exempt") === "true";
      if (!currentlyExempt) {
        const reason = window.prompt("¿Por qué no genera ingreso esta cita? (ej. Rifa de apertura)", "Rifa de apertura");
        if (reason === null) return; // canceló el prompt
        extraPayload = { revenueExempt: true, reason };
      } else {
        extraPayload = { revenueExempt: false };
      }
    }

    btn.disabled = true;
    const headers = { "Content-Type": "application/json", ...(await authHeaders()) };
    const res = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify({ id, ...extraPayload }) });
    const body = await res.json();
    if (!res.ok) {
      alert(body.message || "No se pudo completar la acción.");
    }
    loadBookings();
  });

  filterStatus.addEventListener("change", loadBookings);
  filterDate.addEventListener("change", loadBookings);
  document.getElementById("refresh-btn").addEventListener("click", loadBookings);
  document.getElementById("login-btn").addEventListener("click", () => window.netlifyIdentity.open());
  document.getElementById("logout-btn").addEventListener("click", () => window.netlifyIdentity.logout());

  function showAdmin() {
    loginGate.hidden = true;
    adminWrap.hidden = false;
    loadBookings();
  }
  function showLogin() {
    loginGate.hidden = false;
    adminWrap.hidden = true;
  }

  if (!window.netlifyIdentity) {
    document.getElementById("login-btn").hidden = true;
    const notice = document.createElement("p");
    notice.className = "form-hint is-error";
    notice.textContent = "No se pudo cargar el inicio de sesión. Revisa tu conexión y recarga la página.";
    loginGate.appendChild(notice);
    return;
  }

  window.netlifyIdentity.on("init", (user) => (user ? showAdmin() : showLogin()));
  window.netlifyIdentity.on("login", () => {
    window.netlifyIdentity.close();
    showAdmin();
  });
  window.netlifyIdentity.on("logout", showLogin);
  window.netlifyIdentity.init();
})();
</script>
</body>
</html>
