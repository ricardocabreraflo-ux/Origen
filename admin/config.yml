backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "assets"

locale: "es"

collections:
  - name: "config"
    label: "Contenido del sitio"
    files:
      - file: "data/config.json"
        label: "Información del negocio"
        name: "config"
        fields:
          - { label: "Nombre completo", name: "name", widget: "string", hint: "Se usa en el título de la página y el pie de página." }
          - { label: "Nombre corto", name: "shortName", widget: "string", hint: "Se usa en los mensajes de WhatsApp, para que no queden muy largos." }
          - { label: "Frase principal (hero)", name: "tagline", widget: "text" }
          - { label: "Ícono del logo", name: "logoImage", widget: "image" }
          - { label: "Texto grande del logo", name: "logoText", widget: "string" }
          - { label: "Subtítulo del logo", name: "logoSub", widget: "string" }

          - label: "Fundadora"
            name: "founder"
            widget: "object"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Biografía", name: "bio", widget: "text" }

          - { label: "Cita de marca (sección Sobre nosotros)", name: "brandQuote", widget: "text" }
          - { label: "Foto de la sección Sobre nosotros", name: "aboutImage", widget: "image" }

          - label: "Aviso de apertura / promoción (barra superior)"
            name: "opening"
            widget: "object"
            fields:
              - { label: "Mostrar la barra de aviso", name: "show", widget: "boolean" }
              - { label: "Mensaje", name: "message", widget: "string" }
              - { label: "Fecha", name: "date", widget: "string" }

          - label: "Ventana emergente de promoción"
            name: "promoPopup"
            widget: "object"
            fields:
              - { label: "Mostrar la ventana emergente", name: "show", widget: "boolean" }
              - { label: "Etiqueta pequeña (arriba del título)", name: "eyebrow", widget: "string" }
              - { label: "Título grande", name: "title", widget: "string" }
              - { label: "Mensaje", name: "message", widget: "text" }
              - { label: "Texto del botón", name: "ctaLabel", widget: "string" }
              - { label: "Fecha de vencimiento (deja de mostrarse después de esta fecha)", name: "expiresOn", widget: "string", required: false, hint: "Formato AAAA-MM-DD, ejemplo 2026-08-31. Déjalo vacío para que no venza nunca." }

          - label: "Testimonios (déjalo vacío hasta tener reseñas reales)"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}}"
            allow_add: true
            fields:
              - { label: "Reseña", name: "quote", widget: "text" }
              - { label: "Autora", name: "author", widget: "string" }

          - label: "Canal de contacto principal (botones \"Escríbenos\")"
            name: "contactChannel"
            widget: "object"
            hint: "Mientras tengas problemas con tu WhatsApp Business, cambia el canal a Instagram y todos los botones \"Escríbenos\" del sitio (hero, botón flotante, comprobante de pago, landings de promo) abrirán tu Instagram Direct en su lugar — vuelve a WhatsApp en cuanto lo tengas resuelto. Esto NO afecta los avisos automáticos internos (cita nueva, lealtad, referido), esos siguen intentando WhatsApp aparte y simplemente no se envían si no está configurado."
            fields:
              - label: "Canal"
                name: "channel"
                widget: "select"
                options: [{ label: "WhatsApp", value: "whatsapp" }, { label: "Instagram Direct", value: "instagram" }]
              - { label: "Usuario de Instagram (sin @; déjalo vacío para tomarlo de tu link de Instagram de abajo)", name: "instagramUsername", widget: "string", required: false }

          - { label: "WhatsApp (solo números, con código de país, ej. 52...)", name: "whatsappNumber", widget: "string", pattern: ["^[0-9]+$", "Solo números, sin espacios ni símbolos"] }
          - { label: "Teléfono que se muestra en la página", name: "phoneDisplay", widget: "string" }
          - { label: "Correo de contacto", name: "email", widget: "string" }
          - { label: "Dirección", name: "address", widget: "string" }
          - { label: "Enlace del mapa embebido (Google Maps > Compartir > Insertar mapa)", name: "mapEmbedUrl", widget: "string" }
          - { label: "Enlace a tu página de Google Maps (para el botón \"Ver en Maps\")", name: "mapsUrl", widget: "string", required: false }

          - label: "Horario (texto que se muestra en Contacto)"
            name: "hours"
            widget: "list"
            fields:
              - { label: "Día(s)", name: "day", widget: "string" }
              - { label: "Horario", name: "time", widget: "string" }

          - label: "Horario real (usado para calcular la disponibilidad de citas)"
            name: "businessHours"
            widget: "object"
            hint: "Deja 'Abre'/'Cierra' vacíos en los días que esté cerrado. Formato 24h, ej. 10:00 y 19:00. Debe coincidir con el horario de arriba."
            fields:
              - label: "Lunes"
                name: "mon"
                widget: "object"
                fields:
                  - { label: "Abre", name: "open", widget: "string", required: false }
                  - { label: "Cierra", name: "close", widget: "string", required: false }
              - label: "Martes"
                name: "tue"
                widget: "object"
                fields:
                  - { label: "Abre", name: "open", widget: "string", required: false }
                  - { label: "Cierra", name: "close", widget: "string", required: false }
              - label: "Miércoles"
                name: "wed"
                widget: "object"
                fields:
                  - { label: "Abre", name: "open", widget: "string", required: false }
                  - { label: "Cierra", name: "close", widget: "string", required: false }
              - label: "Jueves"
                name: "thu"
                widget: "object"
                fields:
                  - { label: "Abre", name: "open", widget: "string", required: false }
                  - { label: "Cierra", name: "close", widget: "string", required: false }
              - label: "Viernes"
                name: "fri"
                widget: "object"
                fields:
                  - { label: "Abre", name: "open", widget: "string", required: false }
                  - { label: "Cierra", name: "close", widget: "string", required: false }
              - label: "Sábado"
                name: "sat"
                widget: "object"
                fields:
                  - { label: "Abre", name: "open", widget: "string", required: false }
                  - { label: "Cierra", name: "close", widget: "string", required: false }
              - label: "Domingo"
                name: "sun"
                widget: "object"
                fields:
                  - { label: "Abre", name: "open", widget: "string", required: false }
                  - { label: "Cierra", name: "close", widget: "string", required: false }

          - label: "Redes sociales (deja vacío el que no uses)"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }
              - { label: "WhatsApp (opcional; si se deja vacío se genera solo)", name: "whatsapp", widget: "string", required: false }

          - label: "Galería de fotos"
            name: "galleryImages"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Foto", name: "src", widget: "image" }
              - { label: "Descripción", name: "alt", widget: "string", required: false }

          - label: "Servicios"
            name: "services"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Identificador único (sin espacios ni acentos)", name: "id", widget: "string" }
              - { label: "Nombre del servicio", name: "name", widget: "string" }
              - { label: "Qué incluye", name: "description", widget: "text" }
              - { label: "Precio", name: "price", widget: "string" }
              - { label: "Duración real del servicio (minutos) — define cuánto tiempo se bloquea en la agenda", name: "duration", widget: "number", value_type: "int" }
              - { label: "Anticipo para reservar (MXN)", name: "depositAmount", widget: "number", value_type: "int" }

          - label: "Reservas"
            name: "booking"
            widget: "object"
            fields:
              - { label: "Colchón entre citas (minutos)", name: "bufferMinutes", widget: "number", value_type: "int" }
              - { label: "Minutos para confirmar el depósito antes de liberar el horario", name: "holdMinutes", widget: "number", value_type: "int" }
              - { label: "Con cuántos meses de anticipación se puede reservar", name: "maxAdvanceMonths", widget: "number", value_type: "int" }
              - { label: "WhatsApp donde te llegan las notificaciones de citas nuevas", name: "ownerNotificationPhone", widget: "string", hint: "Número con código de país, ej. 525566095405. Puede ser distinto al WhatsApp del negocio." }

          - label: "Días festivos / cerrados"
            name: "closedDates"
            widget: "list"
            summary: "{{fields.date}} — {{fields.label}}"
            fields:
              - { label: "Fecha (AAAA-MM-DD)", name: "date", widget: "string", hint: "Ejemplo: 2026-12-25" }
              - { label: "Motivo (se muestra a las clientas)", name: "label", widget: "string", required: false, hint: "Ejemplo: Navidad" }

          - label: "Tarjeta de lealtad"
            name: "loyalty"
            widget: "object"
            fields:
              - { label: "Cada cuántas visitas confirmadas se gana la recompensa", name: "cycleSize", widget: "number", value_type: "int" }
              - { label: "Porcentaje de descuento al completar el ciclo", name: "discountPercent", widget: "number", value_type: "int" }

          - label: "Programa de referidos"
            name: "referral"
            widget: "object"
            hint: "El código de descuento en sí se genera solo cuando el referido confirma su primera cita — aquí solo se define cuánto y por cuánto tiempo."
            fields:
              - { label: "Porcentaje de descuento de la recompensa", name: "rewardDiscountPercent", widget: "number", value_type: "int" }
              - { label: "Días de vigencia del código de recompensa", name: "rewardValidDays", widget: "number", value_type: "int" }

          - { label: "ID del Pixel de Meta (Facebook/Instagram Ads)", name: "metaPixelId", widget: "string", required: false, hint: "Se saca en Meta Business → Administrador de eventos. Déjalo vacío si todavía no mides anuncios." }

          - label: "Prueba social"
            name: "socialProof"
            widget: "object"
            fields:
              - label: "Antes / después (deja vacío hasta tener fotos reales, con permiso de la clienta)"
                name: "beforeAfter"
                widget: "list"
                allow_add: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "Foto antes", name: "beforeImage", widget: "image" }
                  - { label: "Foto después", name: "afterImage", widget: "image" }
                  - { label: "Servicio", name: "label", widget: "string" }
              - label: "Posts de Instagram destacados"
                name: "instagramPosts"
                widget: "list"
                allow_add: true
                summary: "{{fields.permalink}}"
                fields:
                  - { label: "Enlace del post (Instagram → ⋯ → Copiar enlace)", name: "permalink", widget: "string" }

          - label: "Datos para transferencia (anticipo)"
            name: "bankTransfer"
            widget: "object"
            fields:
              - { label: "Banco", name: "bankName", widget: "string" }
              - { label: "Titular de la cuenta", name: "accountHolder", widget: "string" }
              - { label: "CLABE", name: "clabe", widget: "string" }
              - { label: "Nota adicional", name: "note", widget: "text", required: false }

          - label: "Políticas"
            name: "policies"
            widget: "object"
            fields:
              - { label: "Título de la sección", name: "title", widget: "string" }
              - label: "Secciones"
                name: "sections"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Título", name: "heading", widget: "string" }
                  - { label: "Texto", name: "body", widget: "text" }

          - label: "Preguntas frecuentes"
            name: "faq"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Pregunta", name: "question", widget: "string" }
              - { label: "Respuesta", name: "answer", widget: "text" }
