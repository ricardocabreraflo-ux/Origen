[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/t"
  to = "/tarjeta.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[functions."send-reminders"]
  schedule = "*/15 * * * *"

[functions."track-pipeline"]
  schedule = "0 */6 * * *"

[functions."track-discover-competitors"]
  schedule = "0 9 * * 1"
