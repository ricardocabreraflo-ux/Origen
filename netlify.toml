[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/t"
  to = "/tarjeta.html"
  status = 200

# Landing de campaña: /promo-verano -> promo.html?slug=verano (una sola
# plantilla reutilizada por todas las campañas, ver promo.html).
[[redirects]]
  from = "/promo-*"
  to = "/promo.html?slug=:splat"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[functions."send-reminders"]
  schedule = "*/15 * * * *"
